name: Release

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build & verify but skip npm publish and git tag)'
        type: boolean
        default: false
        required: false
      skip_deprecated:
        description: 'Skip npm deprecate of old easemob-chat-callkit-vue3'
        type: boolean
        default: false
        required: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ====================================================================
      # 自动发布：push 到 dev 分支时由 changesets/action 接管
      #
      # 流程：
      #   1. 存在 changeset 文件 → 创建 / 更新 "Version Packages" PR
      #   2. 无 changeset 文件（即 Version Packages PR 刚被合并）→ 执行 publish
      # ====================================================================
      - name: Create Release Pull Request or Publish
        if: github.event_name == 'push'
        uses: changesets/action@v1
        with:
          publish: node scripts/publish.mjs
          version: pnpm run version-packages
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ====================================================================
      # 手动发布：在 GitHub Actions 页面手动触发
      #
      # 选项：
      #   dry_run: 构建 + 检查但不真正推送到 npm
      #   skip_deprecated: 不废弃旧包 easemob-chat-callkit-vue3
      # ====================================================================
      - name: Manual Publish
        if: github.event_name == 'workflow_dispatch'
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="--dry-run"
          fi
          if [ "${{ github.event.inputs.skip_deprecated }}" = "true" ]; then
            FLAGS="$FLAGS --skip-deprecated"
          fi
          node scripts/publish.mjs $FLAGS

      # 上传生成的 tgz 作为 workflow artifact（存在则上传）
      - name: Upload tgz artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-tgz
          path: release/*.tgz
          if-no-files-found: ignore
